name: Project Checks

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "mods/fabric/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-typecheck.yml"
  push:
    branches:
      - main

jobs:
  api-typecheck:
    name: API Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm api:typecheck

  fabric-build:
    name: Fabric Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build Fabric Mod
        working-directory: mods/fabric
        run: gradle build --stacktrace
