name: Project Checks

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "mods/fabric/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-typecheck.yml"
  push:
    branches:
      - main

jobs:
  api-typecheck:
    name: API Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm api:typecheck

  fabric-build:
    name: Fabric Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1
      - name: Build Fabric Mod
        working-directory: mods/fabric
        shell: bash
        run: |
          set +e
          gradle build --stacktrace --no-daemon > ../../fabric-build.log 2>&1
          status=$?
          cat ../../fabric-build.log
          exit $status
      - name: Upload Fabric build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-build-log
          path: fabric-build.log
