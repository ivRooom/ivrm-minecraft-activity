name: Project Checks

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "mods/fabric/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - ".github/workflows/api-typecheck.yml"
  push:
    branches:
      - main

jobs:
  api-typecheck:
    name: API Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:typecheck

  fabric-build:
    name: Fabric Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1
      - name: Build Fabric Mod
        working-directory: mods/fabric
        shell: bash
        run: |
          set +e
          gradle build --stacktrace --no-daemon --warning-mode all > ../../fabric-build.log 2>&1
          status=$?
          cat ../../fabric-build.log
          exit $status
      - name: Upload Fabric build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-build-log
          path: fabric-build.log

  docker-security:
    name: Docker ${{ matrix.dockerfile }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: amd64
            dockerfile: Dockerfile
          - runner: ubuntu-24.04-arm
            platform: arm64
            dockerfile: Dockerfile
          - runner: ubuntu-24.04
            platform: amd64
            dockerfile: apps/api/Dockerfile
          - runner: ubuntu-24.04-arm
            platform: arm64
            dockerfile: apps/api/Dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runner architecture
        shell: bash
        run: test "$(dpkg --print-architecture)" = "${{ matrix.platform }}"
      - name: Build final API image with frozen dependencies
        run: docker build --platform linux/${{ matrix.platform }} -f ${{ matrix.dockerfile }} -t mc-activity:ci .
      - name: Validate final container Node binary and non-root compatibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' mc-activity:ci)" = "${{ matrix.platform }}"
          test "$(docker run --rm --entrypoint node mc-activity:ci --version)" = v22.23.4
          docker run --rm --entrypoint node mc-activity:ci -p 'process.versions.openssl'
