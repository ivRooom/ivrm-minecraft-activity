name: Temporary Security Lockfile Refresh
on:
  push:
    branches: [security/node-22-23-4-lockfile-20261030]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Generate lockfile without running lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Export lockfile only
        run: |
          echo '===LOCKFILE_BEGIN==='
          cat pnpm-lock.yaml
          echo '===LOCKFILE_END==='
